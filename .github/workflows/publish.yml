name: Publish to GitHub Packages

# Runs when you push a version tag, e.g.:
#   git tag 1.0.1 && git push origin 1.0.1
# You can also start it by hand from the Actions tab.
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.1)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :eventBox:testReleaseUnitTest --console=plain

      - name: Publish library
        run: ./gradlew :eventBox:publishReleasePublicationToGitHubPackagesRepository --console=plain
        env:
          VERSION: ${{ github.event.inputs.version || github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
